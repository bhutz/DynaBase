<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About &mdash; DynaBase</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<h1 class="site-title">Dynabase</h1>

<nav class="static-links">
  <a href="about.html">About Dynabase</a>
  <a href="data-summary.html">Summary of Included Data</a>
  <a href="extreme-examples.html">Summary of Extreme Examples</a>
</nav>

<hr class="header-rule">

<form class="selectors" id="selectors">
  <label>Dimension
    <select id="sel-dimension">
      <option value="1" selected>1</option>
    </select>
  </label>
  <label>Degree
    <select id="sel-degree">
      <option value="2" >2</option>
      <option value="3" >3</option>
    </select>
  </label>
  <label>Type
    <select id="sel-type">
      <option value="polynomial" >polynomial</option>
      <option value="rational" >rational</option>
    </select>
  </label>
  <label>Problem
    <select id="sel-problem">
      <option value="rational-preperiodic" selected>Rational Preperiodic</option>
    </select>
  </label>
  <button type="submit">View</button>
</form>
<script>
document.getElementById('selectors').addEventListener('submit', function (e) {
  e.preventDefault();
  var dim = document.getElementById('sel-dimension').value;
  var deg = document.getElementById('sel-degree').value;
  var typ = document.getElementById('sel-type').value;
  var prob = document.getElementById('sel-problem').value;
  window.location.href = 'data/' + dim + '/' + deg + '/' + typ + '/' + prob + '.html';
});
</script>

<main>

<h1>About Dynabase</h1>
<p>This is a database of arithmetic dynamical systems.</p>
<p class="stub-note">(We'll fill this in later.)</p>

</main>

<footer class="site-footer">
  <p>DynaBase &mdash; Database of Arithmetic Dynamics</p>
</footer>
</body>
</html>
