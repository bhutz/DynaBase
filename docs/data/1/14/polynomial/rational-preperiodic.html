<form class="selectors" id="selectors">
  <label>Dimension
    <select id="sel-dimension">
      <option value="1" selected>1</option>
    </select>
  </label>
  <label>Degree
    <select id="sel-degree">
      
      <option value="2" >2</option>
      
      <option value="3" >3</option>
      
      <option value="4" >4</option>
      
      <option value="5" >5</option>
      
      <option value="6" >6</option>
      
      <option value="7" >7</option>
      
      <option value="8" >8</option>
      
      <option value="9" >9</option>
      
      <option value="10" >10</option>
      
      <option value="11" >11</option>
      
      <option value="12" >12</option>
      
      <option value="13" >13</option>
      
      <option value="14" selected>14</option>
      
      <option value="15" >15</option>
      
    </select>
  </label>
  <label>Type
    <select id="sel-type">
      <option value="polynomial" selected>polynomial</option>
      <option value="rational" >rational</option>
    </select>
  </label>
  <label>Problem
    <select id="sel-problem">
      
      <option value="rational-preperiodic" selected>Rational Preperiodic</option>
      
      <option value="postcritically-finite" >Postcritically Finite</option>
      
    </select>
  </label>
  <button type="submit">View</button>
</form>
<script>
document.getElementById('selectors').addEventListener('submit', function (e) {
  e.preventDefault();
  var dim = document.getElementById('sel-dimension').value;
  var deg = document.getElementById('sel-degree').value;
  var typ = document.getElementById('sel-type').value;
  var prob = document.getElementById('sel-problem').value;
  window.location.href = '../../../../data/' + dim + '/' + deg + '/' + typ + '/' + prob + '.html';
});
</script>
